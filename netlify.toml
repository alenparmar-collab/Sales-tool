# Netlify deploy config.
#
# The site is plain static HTML with no build step -- everything the page
# needs is inline. Netlify serves web/ directly and detects the
# data-netlify form in index.html at deploy time, which is what registers
# the email capture (submissions land in Site configuration > Forms).

[build]
  publish = "web"
  command = ""

# The page carries en-dashes and middots. Without an explicit charset the
# browser guesses, and a Latin-1 guess renders them as mojibake -- which is
# exactly what a local server with no charset header produced during
# testing. Declared rather than left to the host's default.
[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# The data index (once the pipeline has produced one) is content-hashed
# and safe to cache hard; the page itself must not be, so a redeploy is
# visible immediately.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
