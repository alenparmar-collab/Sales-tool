# Employer alias map: filing entities -> one canonical employer.
#
# DOL files list legal entities, not companies. Amazon appears as six
# separate entities totalling 65,038 filings; without this map a search for
# "Amazon" reports 44,068 and understates by a third. This file is what says
# those entities are one employer, and src/build_index.py applies it when
# building the index the site serves.
#
# ---------------------------------------------------------------------------
# STATUS: DRAFT, PENDING REVIEW.
#
# Written from the real top-employer list produced by the 2026-08-25 run
# (1,775,106 certified filings, 138,656 distinct employers). Every `variants`
# string below was copied from the actual index, so they match exactly. The
# groupings are my reading of which entities are the same company; that is
# the part worth a second pair of eyes, since a wrong grouping here silently
# overstates an employer's volume.
#
# Covers roughly the top 90 employers by volume. Below that the tail is long
# and thin -- employers absent from this file simply stay un-merged, which is
# correct behaviour rather than breakage. Extend from
# data/processed/top_500_employers.csv whenever you have an hour.
#
# ---------------------------------------------------------------------------
# WHAT I DELIBERATELY DID NOT MERGE, and why. These share a leading word but
# are different companies; merging them would be a real error:
#
#   META PLATFORMS      is Meta. META IT, METAFORGE IT, METASENSE,
#                       METAHORIZON and METAPICKS are unrelated firms.
#   TATA CONSULTANCY    is TCS. TATA ELXSI and TATA COMMUNICATIONS are
#                       separate Tata group companies. Bare "TATA" (328
#                       filings) is ambiguous and left alone.
#   APPLE               is Apple. APPLEXUS, APPLET and APPLE PROCESSING are
#                       not. APPLE PAYMENTS (58) probably is, but "probably"
#                       is not good enough to merge.
#   UST                 is UST Global. USTRING and USTECHSYSTEM are not.
#   CGI TECHNOLOGIES    is CGI. CGINFOSYS is a different firm.
#   INFINITE COMPUTER   is one firm; INFINITE CONSULTING / TEK / GATEWAY are
#                       others.
#   GOLDMAN SACHS       entities merged; GOLDMAN EDWARDS is unrelated.
#
# The same trap appears elsewhere in the data with GENERAL MOTORS vs GENERAL
# HOSPITAL, TEXAS A M vs TEXAS INSTRUMENTS, and NORTHWESTERN UNIVERSITY vs
# NORTHWESTERN MUTUAL. Watch for it as you extend this file.
#
# ---------------------------------------------------------------------------
# ON is_staffing_or_consulting:
#
# Set true where a filing tells you little about your odds because the job is
# at a client site, not at the employer named. Set for the IT services and
# staffing firms below.
#
# Left FALSE for Deloitte, EY, PwC, KPMG, McKinsey and BCG, on the reading
# that you are hired by the firm rather than placed by it, even though the
# work happens at clients. That is a judgment call and yours to make --
# flipping any of them is a one-word edit.
# ---------------------------------------------------------------------------

