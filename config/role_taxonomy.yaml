# Role bucket classification config. Editable by hand -- no code changes
# needed to add a synonym or retune a SOC mapping.
#
# CLASSIFICATION ORDER (see src/role_taxonomy.py):
#   1. soc_clean  -- SOC codes that map unambiguously to exactly one bucket.
#      These win outright; title keywords cannot override them.
#   2. keywords   -- phrase match against the title (seniority already
#      stripped), longest phrase first.
#   3. soc_coarse -- SOC codes too broad to decide alone (15-1252 covers a
#      QA tester and a principal engineer alike). Used only as a fallback
#      default when no keyword matched, so keywords refine within them.
#   4. other      -- logged to data/processed/unmatched_titles_top_100.csv
#      for hand-adding to the keyword lists below.
#
# Titles are normalized before matching: uppercased, punctuation to space,
# whitespace collapsed, seniority tokens removed (kept in their own column).

seniority_tokens:
  senior: [SENIOR, SR]
  lead: [LEAD]
  staff: [STAFF]
  principal: [PRINCIPAL]
  junior: [JUNIOR, JR]
  associate: [ASSOCIATE]
  entry: [ENTRY, ENTRY LEVEL]

# SOC codes that decide the bucket on their own.
soc_clean:
  "15-2051": data_scientist          # Data Scientists
  "15-1243": data_engineer           # Database Architects
  "15-1242": data_engineer           # Database Administrators
  "15-1212": security_engineer       # Information Security Analysts
  "15-1244": devops_sre              # Network and Computer Systems Administrators
  "13-2051": finance_analyst         # Financial and Investment Analysts
  "13-2054": finance_analyst         # Financial Risk Specialists
  "11-9111": healthcare_admin        # Medical and Health Services Managers
  "17-2141": mechanical_engineer     # Mechanical Engineers
  "17-2071": electrical_engineer     # Electrical Engineers
  "17-2072": electrical_engineer     # Electronics Engineers
  "17-2051": civil_engineer          # Civil Engineers
  "11-2021": product_manager         # Marketing Managers (PM-adjacent filings)

# SOC codes too coarse to decide alone -- a default only if no keyword hits.
soc_coarse:
  "15-1252": software_engineer       # Software Developers
  "15-1251": software_engineer       # Computer Programmers
  "15-1253": qa_engineer             # Software QA Analysts and Testers
  "15-1211": business_analyst        # Computer Systems Analysts
  "15-1232": business_analyst        # Computer User Support Specialists
  "15-1299": software_engineer       # Computer Occupations, All Other
  "13-1111": business_analyst        # Management Analysts
  "13-1161": business_analyst        # Market Research Analysts
  "11-3021": product_manager         # Computer and Information Systems Managers

